name: US-102 limpieza de capturas
on:
  schedule:
    # Respaldo cada hora: al cerrar la cuenta la captura ya se borra en el momento.
    - cron: '17 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: limpieza-capturas
  cancel-in-progress: false
jobs:
  limpiar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Eliminar capturas vencidas o de cuentas cerradas
        env:
          APP_URL: ${{ vars.CAPTURAS_APP_URL }}
          CRON_SECRET: ${{ secrets.CAPTURAS_CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "limpieza no configurada: falta CAPTURAS_APP_URL o CAPTURAS_CRON_SECRET"
            exit 0
          fi
          curl --fail --silent --show-error --max-time 240 --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/capturas/limpieza"
