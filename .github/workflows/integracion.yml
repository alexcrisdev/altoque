name: Pruebas de integración

# US-095: en los PR corre solo. En develop y main lo llama pipeline-main.yml (etapa 2).
# US-106: cada ejecución levanta su propia Supabase local desechable (migraciones + seed).
# No usa claves ni la URL de la base compartida; por eso ya no comparte grupo de concurrencia.
on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  integracion:
    name: integracion
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7.0.1

      - name: Configurar Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Levantar Supabase local desechable
        # Aplica todas las migraciones y supabase/seed.sql. La salida trae claves locales: no se imprime.
        run: |
          npx supabase start -x studio,imgproxy,vector,logflare,edge-runtime,supavisor,postgres-meta,mailpit \
            > "$RUNNER_TEMP/supabase-start.log" 2>&1 \
            || { grep -viE 'key|secret|jwt|password' "$RUNNER_TEMP/supabase-start.log"; exit 1; }
          echo "Supabase local iniciado con migraciones y seed."

      - name: Preparar variables y cuentas demo locales
        run: |
          npx supabase status -o env > "$RUNNER_TEMP/supabase.env" 2>/dev/null
          # Enmascara cada valor (claves locales) antes de que algo pueda imprimirlo.
          while IFS='=' read -r nombre valor; do
            valor="${valor%\"}"; valor="${valor#\"}"
            case "$nombre" in *_URL) continue ;; esac
            if [ -n "$valor" ]; then echo "::add-mask::$valor"; fi
          done < "$RUNNER_TEMP/supabase.env"
          set -a; . "$RUNNER_TEMP/supabase.env"; set +a
          rm "$RUNNER_TEMP/supabase.env"
          DEMO_PASSWORD="$(openssl rand -hex 18)"
          echo "::add-mask::$DEMO_PASSWORD"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            # Solo para preparar datos de las pruebas de Node en la base local.
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "DEMO_PASSWORD=$DEMO_PASSWORD"
          } >> "$GITHUB_ENV"
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY" \
            SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" DEMO_PASSWORD="$DEMO_PASSWORD" \
            node scripts/usuarios-demo.mjs

      - name: Exigir Supabase local
        # Si la URL no es 127.0.0.1 o localhost, el job falla antes de probar.
        run: node scripts/exigir-supabase-local.mjs

      - name: Ejecutar pruebas de integración
        run: >-
          npm run test:integracion -- --reporter=default --reporter=junit
          --outputFile.junit=resultados-integracion.xml

      - name: Resumir resultados
        if: always()
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          archivo = Path("resultados-integracion.xml")
          resumen = Path(os.environ["GITHUB_STEP_SUMMARY"])
          if not archivo.is_file():
              with resumen.open("a", encoding="utf-8") as salida:
                  salida.write("\n## Pruebas RLS\nNo se generó el reporte JUnit. Revisa el paso de ejecución.\n")
          else:
              raiz = ET.parse(archivo).getroot()
              suites = list(raiz.iter("testsuite"))
              pruebas = sum(int(suite.get("tests", "0")) for suite in suites)
              fallidas = sum(int(suite.get("failures", "0")) for suite in suites)
              errores = sum(int(suite.get("errors", "0")) for suite in suites)
              omitidas = sum(int(suite.get("skipped", "0")) for suite in suites)
              aprobadas = pruebas - fallidas - errores - omitidas
              archivos = sorted({Path(suite.get("name", "suite sin nombre")).name for suite in suites})
              with resumen.open("a", encoding="utf-8") as salida:
                  salida.write("\n## Resultado de pruebas RLS\n")
                  salida.write(f"- Archivos: {', '.join(archivos) if archivos else 'sin suites reportadas'}\n")
                  salida.write(f"- Casos: {aprobadas} aprobados de {pruebas}; {fallidas} fallidos, {errores} errores y {omitidas} omitidos.\n")
          PY

      - name: Guardar reporte JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-integracion
          path: resultados-integracion.xml
          if-no-files-found: warn
