name: Smoke despliegue

# US-029: cuando Vercel termina un despliegue (preview, staging o producción)
# avisa a GitHub y aquí se prueba la URL publicada. Solo hace lecturas.
on:
  deployment_status:

permissions:
  contents: read

jobs:
  smoke:
    if: github.event.deployment_status.state == 'success'
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7.0.1

      - name: Configurar Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'

      - name: Probar la URL desplegada
        env:
          URL_DESPLIEGUE: ${{ github.event.deployment_status.environment_url }}
        run: node scripts/smoke.mjs "$URL_DESPLIEGUE"
