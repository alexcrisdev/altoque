name: US-145 ventas diarias y US-146 sugerencia de stock
on:
  schedule:
    # 00:20 de Lima (05:20 UTC): recalcula los últimos 7 días terminados y luego
    # genera la sugerencia de stock de hoy y mañana (US-146).
    - cron: '20 5 * * *'
  workflow_dispatch:
    inputs:
      dias:
        description: 'Días a recalcular (1 a 35; 35 para la carga inicial de US-146)'
        required: false
        default: '7'
permissions: {}
concurrency:
  group: ventas-diarias
  cancel-in-progress: false
jobs:
  consolidar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Consolidar ventas por plato y día
        env:
          APP_URL: ${{ vars.VENTAS_APP_URL }}
          CRON_SECRET: ${{ secrets.VENTAS_CRON_SECRET }}
          DIAS: ${{ inputs.dias || '7' }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::Consolidación no configurada: falta VENTAS_APP_URL o VENTAS_CRON_SECRET"
            exit 0
          fi
          case "$DIAS" in
            ''|*[!0-9]*) echo "::error::dias debe ser un número"; exit 1 ;;
          esac
          curl --fail-with-body --silent --show-error --max-time 240 --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/ventas/consolidar?dias=$DIAS"
      # US-146: solo corre si la consolidación terminó bien (si falla, el job se detiene).
      - name: Generar sugerencia de stock de hoy y mañana
        env:
          APP_URL: ${{ vars.VENTAS_APP_URL }}
          CRON_SECRET: ${{ secrets.VENTAS_CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::Sugerencia no configurada: falta VENTAS_APP_URL o VENTAS_CRON_SECRET"
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 240 --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/ventas/sugerir-stock"
