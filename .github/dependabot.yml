# US-043: GitHub revisa cada semana si hay versiones nuevas de las librerías
# (npm) y de las acciones de los workflows, y abre PRs contra develop.
# Se agrupan para no llenar el repo de PRs sueltos.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: America/Lima
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      produccion:
        dependency-type: production
        update-types: [minor, patch]
      desarrollo:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Un salto de versión mayor en el framework puede romper la app;
      # esos se actualizan a mano después de la entrega.
      - dependency-name: next
        update-types: ['version-update:semver-major']
      - dependency-name: react
        update-types: ['version-update:semver-major']
      - dependency-name: react-dom
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: America/Lima
    commit-message:
      prefix: deps
    groups:
      acciones:
        patterns: ['*']
