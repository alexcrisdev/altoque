name: altoque-n8n

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.46.7
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      TZ: America/Lima
      GENERIC_TIMEZONE: America/Lima
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Configura la clave local en infra/n8n/.env}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      N8N_EDITOR_BASE_URL: http://localhost:5678/
      N8N_PROXY_HOPS: "1"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_PUBLIC_API_DISABLED: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "24"
    volumes:
      - datos_n8n:/home/node/.n8n
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

  entrada-webhook:
    image: nginx:1.30.6-alpine
    profiles: ["tunel"]
    restart: unless-stopped
    depends_on:
      n8n:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # Sin puertos publicados: solo cloudflared accede por la red de Compose.

  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    profiles: ["tunel"]
    restart: "no"
    depends_on:
      - entrada-webhook
    command: ["tunnel", "--no-autoupdate", "--url", "http://entrada-webhook:8080"]

volumes:
  datos_n8n:
