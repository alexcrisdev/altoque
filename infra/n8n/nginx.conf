# Únicas rutas accesibles por el túnel; editor, REST, OAuth y webhooks de test bloqueados.
limit_req_zone $binary_remote_addr zone=prueba:1m rate=5r/m;
# US-086: avisos de pago desde Vercel (las IP cambian; límite por IP generoso).
limit_req_zone $binary_remote_addr zone=pagos:1m rate=60r/m;

server {
    listen 8080;
    server_tokens off;
    client_max_body_size 16k;
    access_log off;

    location = /webhook/us071-correo-prueba {
        limit_except POST { deny all; }
        limit_req zone=prueba burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://n8n:5678;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }

    # US-086: aviso firmado de pago confirmado. La firma HMAC la valida n8n.
    location = /webhook/altoque-pago-confirmado {
        limit_except POST { deny all; }
        limit_req zone=pagos burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://n8n:5678;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
