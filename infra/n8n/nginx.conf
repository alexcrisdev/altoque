# Única ruta accesible por el túnel; editor, REST, OAuth y webhooks de test bloqueados.
limit_req_zone $binary_remote_addr zone=prueba:1m rate=5r/m;

server {
    listen 8080;
    server_tokens off;
    client_max_body_size 16k;
    access_log off;

    location = /webhook/us071-correo-prueba {
        limit_except POST { deny all; }
        limit_req zone=prueba burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://n8n:5678;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }

    location / {
        return 404;
    }
}
